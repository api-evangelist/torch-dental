name: Torch Dental
description: 'Torch Dental is a New York-based vertical-software company that builds a procurement
  and practice-management platform for dental practices and dental service organizations (DSOs).
  The platform lets dental offices order supplies across multiple vendors from a single catalog,
  compare prices, manage budgets and approvals, track orders and invoices, and streamline
  back-office purchasing. Torch Dental is backed by Bessemer Venture Partners and was surfaced
  through that portfolio and added to the API Evangelist network for enrichment. As of this pass
  the company exposes no public developer API, developer portal, documentation, or SDKs; its
  web presence sits behind a bot-challenge wall and there is no reachable api./developers./docs.
  subdomain, so this profile captures identity and domain-security posture only.'
